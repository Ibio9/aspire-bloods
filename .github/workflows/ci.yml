name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      # Dummy values only used to satisfy zod env validation for typecheck/build/test —
      # nothing here connects to a real database or service in this job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-only-secret-not-used-in-production-0000000000000000
      JWT_REFRESH_SECRET: ci-only-secret-not-used-in-production-1111111111111111
      CSRF_SECRET: ci-only-secret-not-used-in-production-2222222222222222
      ENCRYPTION_KEY: 6y+xZU3Zngi0F5BZXCzGrBvHAYM3KTPwKETMNvNK7I8=
      FILE_SIGNING_SECRET: ci-only-secret-not-used-in-production-3333333333333333
      ADMIN_EMAILS: ci-admin@example.com
      EXPOSE_DEV_OTP_CODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
