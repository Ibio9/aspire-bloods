  /Order/CreatePendingOrder:
    post:
      tags:
        - Order
      summary: Create Pending Order
      description: "Create Pending Order should be called if only initial test order details have been captured and Sample Collection is to take place at later date i.e. In Clinic Booking, Home Testing Kit.\n\nExternalNumber - This is returned in the success response and corresponds to the OrderNumber"
      operationId: create-pending-order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePendingOrderRequest'
            example:
              FirstName: Joe
              LastName: Bloggs
              DateOfBirth: '2001-01-01'
              BiologicalSexId: 1
              TestClinicLocationId: 10
              PanelIds:
                - 1
              TestIds: [ ]
              IsHealthCheckPanelReport: false
              IsCvScoreRequired: false
              TestReasons:
                - Id: 1
                  Details: Test Reason Details
                - Id: 3
                  Details: More Test Reason Details
      responses:
        '200':
          description: Success
          headers:
            statusCode:
              description: Internal Randox status code
              schema:
                type: integer
            message:
              description: Additional information on message response status
