components:
  schemas:
    CreatePendingOrderRequest:
      required:
        - FirstName
        - LastName
        - DateOfBirth
        - BiologicalSexId
        - TestClinicLocationId
        - IsHealthCheckPanelReport
        - TestReasons
      type: object
      properties:
        FirstName:
          type: string
        LastName:
          type: string
        DateOfBirth:
          type: string
        BiologicalSexId:
          type: integer
        TestClinicLocationId:
          type: integer
        PanelIds:
          type: array
          items:
            type: integer
        TestIds:
          type: array
          items:
            type: integer
        IsHealthCheckPanelReport:
          type: boolean
        IsCvScoreRequired:
          type: boolean
        TestReasons:
          type: array
          items:
            required:
              - Id
              - Details
            type: object
            properties:
              Id:
                type: integer
              Details:
                type: string
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: [ ]
  - apiKeyQuery: [ ]