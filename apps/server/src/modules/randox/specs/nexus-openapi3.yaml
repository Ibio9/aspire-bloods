  /Order/UpdateOrder:
    post:
      tags:
        - Order
      summary: Update Order
      description: "Update an existing Order. If the order is currently Pending, this will move the Order forward to Sample Collection submitted. All order details must be provided again. Anything omitted will be taken as a removal i.e. if PanelIds is left blank, it will remove any existing Panels associated with the Order. \n\nSampleLaboratoryId - Always default to 1.\n\nSampleCollectionDate - It must include the time and be UTC: 2025-02-19T15:20\n\nExternalNumber - This is returned in the success response and corresponds to the OrderNumber "
