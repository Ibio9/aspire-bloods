  /Order/CreateOrder:
    post:
      tags:
        - Order
      summary: Create Order
      description: "Create Order should be called if Sample Collection has already been carried out and all details are ready to be sent through.\n\nSampleLaboratoryId - Always default to 1.\n\nSampleCollectionDate - It must include the time and be UTC: 2025-02-19T15:20 \n\nExternalNumber - This is returned in the success response and corresponds to the OrderNumber"
      operationId: create-order
      requestBody:
        content:
          application/json:
            example:
              Patient:
                FirstName: Joe
                LastName: Bloggs
                DateOfBirth: '2001-01-01'
                IsHealthCheckPanelReport: true
                IsCvScoreRequired: false
                Height: 180
                Weight: 100
                Waist: 40
                Hip: 10
                Pulse: 70
                SystolicBloodPressure: 80
                DiastolicBloodPressure: 60
                Diabetic: false
                Smoker: true
                KnownVascularDisease: false
                OnMedForHypertension: true
                TestClinicLocationId: 10
                EthnicityId: 1
                BiologicalSexId: 1
              PanelIds:
                - 1
              TestIds: [ ]
              TestReasons:
                - Id: '1'
                  Details: Test Reason Details
                - Id: '3'
                  Details: More Test Reason Details
              SampleCollection:
                SampleCollectionDate: '2025-04-19T03:20:00.0000000+00:00'
                SampleCollectionComment: Hello
                SampleLaboratoryId: 1
                SampleTubes:
                  - Id: 1
                    QuantityRequired: 2
                  - Id: 3
                    QuantityRequired: 3
      responses:
        '200':
          description: Success
          headers:
            statusCode:
              description: Internal Randox status code
              schema:
                type: integer
            message:
              description: Additional information on message response status
              schema:
                type: string
          content:
            application/json:
              example:
                orderId: 10300
                externalNumber: GC1123-00010300
        '400':
          description: Bad request
