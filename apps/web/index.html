<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aspire Bloods</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e3dfd3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#25221e" media="(prefers-color-scheme: dark)" />
    <!-- The two faces the first paint needs: Fraunces for the page title,
         IBM Plex Sans for everything else on screen. Preloaded against fixed
         paths (see public/assets/fonts/README.md) because the alternative is
         the browser not discovering them until it has parsed the stylesheet,
         which is a visible flash of the fallback stack on every cold load.
         IBM Plex Mono is deliberately NOT preloaded — no number is above the
         fold before the data arrives, so it would compete with the two that
         are. crossorigin is required even same-origin: a preload without it
         is fetched in a different mode from the CSS request and downloads the
         file twice. -->
    <link
      rel="preload"
      href="/assets/fonts/ibm-plex-sans-variable-latin-v5.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/fraunces-variable-latin-v5.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Theme, resolved before the first paint rather than after React mounts.
         A file rather than an inline block: the portal's CSP is script-src
         'self', which blocks inline execution outright, and weakening it with
         'unsafe-inline' to save one request on a page of medical results is
         not a trade this product makes. Still parser-blocking and still in
         <head>, which is what puts it ahead of the first paint — a deferred or
         bundled version runs after the browser has painted the light default,
         which is exactly the cream flash it exists to prevent.
         Nothing in this document may be an inline script. src/lib/theme.test.ts
         fails if one appears here, and e2e/route-console.spec.ts fails if one
         reaches the served page. -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
